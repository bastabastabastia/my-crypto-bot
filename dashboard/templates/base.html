<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="30" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 backdrop-blur z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">🤖 Crypto Agent — Dashboard</h1>
      <span class="text-xs text-slate-400">Auto-refresh 30s · {{ status.now }}</span>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-slate-500 py-6">
    Données : {{ status.data_dir }}
  </footer>
</body>
</html>
